<style>
/* Layout: DJ-software browser — filter tree | track list / calendar | deck (selected event) */
:root{
  --bg:#08090b; --panel:#131519; --panel2:#1b1e24; --panel3:#171a1f; --line:#2a2e36; --fg:#e9ecf1; --mute:#8f96a3;
  --accent:#1f8bff; --accent-fg:#fff; --sel:#1d3f6e;
  --sex:#ff8a9a; --sex-bg:rgba(255,120,140,.10); --sex-line:rgba(255,138,154,.45);
  --lg:#c9a8ff; --lg-bg:rgba(180,140,255,.12); --lg-line:rgba(201,168,255,.45);
  --neg:#ff5a6a; --neg-bg:rgba(255,90,106,.12);
  --aw:#ffd24a; --aw-bg:rgba(255,210,74,.12); --aw-line:rgba(255,210,74,.4);
  --od:#5fe0c0; --od-bg:rgba(95,224,192,.10); --od-line:rgba(95,224,192,.4);
  --f-pixel:"Doto","Courier New",monospace;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gen:#2ec5e6;--gen-bg:rgba(46,197,230,.10);--gen-line:rgba(46,197,230,.5);--col:#ff8c1a;--col-bg:rgba(255,140,26,.12);--col-line:rgba(255,140,26,.55);
  --cueA:#ff3347;--cueB:#3d74ff;--cueC:#2fd145;--cueD:#b35cff;--cueE:#22c983;--cueF:#ff8c1a;--cueG:#4b7dff;--cueH:#f5c400;
  --top:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 32px}
@media (min-width:500px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;flex-wrap:nowrap;align-items:center;gap:8px 14px;padding-block:10px;border-bottom:1px solid var(--line);min-height:var(--top)}
.burger{display:none;width:38px;height:34px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);position:relative;padding:0}
.burger span,.burger span::before,.burger span::after{content:"";position:absolute;left:10px;right:10px;height:2px;background:var(--fg);border-radius:1px}
.burger span{top:16px}.burger span::before{left:0;right:0;top:-6px}.burger span::after{left:0;right:0;top:6px}
.burger .fic{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);color:var(--fg)}
.burger em{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-style:normal;font-family:var(--f-mono);font-size:10px;line-height:17px;text-align:center;padding:0 4px}
.drawer-head{display:none}
#msearch{margin-top:10px}
#msearch .lbl{display:none}
#msearch:empty{display:none}
.dscrim{position:fixed;inset:0;z-index:13;background:rgba(0,0,0,.6)}
@media (max-width:879px){
  .burger{display:inline-block}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:14;width:min(86vw,340px);overflow-y:auto;border-radius:0;border:0;border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 20px) max(14px,env(safe-area-inset-left,0px));transform:translateX(-102%);visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .drawer-head b{font-family:var(--f-pixel);font-weight:900;font-size:20px}
  .drawer-head button{width:32px;height:32px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);font-size:18px}
  .top{gap:8px 5px;flex-wrap:wrap}
  .top .spacer{flex:1 1 0;min-width:0}
  .top .seg[aria-label="View"]{order:3;width:100%;display:flex}
  .top .seg[aria-label="View"] button{flex:1 1 auto}
  .top .seg button{padding:5px 7px;font-size:12px}
  .top .seg[aria-label="View"] button{padding:5px 2px;font-size:11px;letter-spacing:.02em;min-width:0}
  .top .seg[aria-label="View"] .favnav{padding:5px 8px}
  .top .brand{font-size:19px;gap:5px}
  .top .brand .astro{width:22px}
  .zseg button{padding:3px 2px}
  .top .seg[aria-label="Language"] button{padding:5px 6px}
  .brand .astro{width:28px}
}
@media (max-width:879px) and (prefers-reduced-motion:no-preference){.side{transition:transform .2s ease,visibility .2s}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-weight:900;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:lowercase}

@media (prefers-reduced-motion:no-preference){
  .brand .astro{transform-origin:50% 100%;animation:astro-dance 1s steps(1) infinite}

}
@keyframes astro-dance{
  0%{transform:translateY(0) scaleX(1) rotate(0)}
  25%{transform:translateY(-4px) scaleX(1) rotate(-8deg)}
  50%{transform:translateY(0) scaleX(-1) rotate(0)}
  75%{transform:translateY(-4px) scaleX(-1) rotate(-8deg)}
}
.brand .dot{display:inline-block;width:.16em;height:.16em;background:var(--accent);margin:0 .12em 0 0;vertical-align:baseline}
.brand span{white-space:nowrap}
.brand .beta{font-family:var(--f-mono);font-weight:700;font-size:.4em;letter-spacing:.06em;color:var(--accent);vertical-align:top;position:relative;top:-.15em;margin-left:.25em;line-height:1}
.betab{display:flex;flex-direction:column;align-items:flex-start;gap:3px;align-self:flex-start;margin:1px 0 0 -4px;font-family:var(--f-mono);line-height:1;text-transform:none}
.betab .beta{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.betab a{position:relative;font-size:10px;color:var(--mute);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line);white-space:nowrap}
.betab a::after{content:"";position:absolute;inset:-9px -6px}
.betab a:hover{color:var(--fg);text-decoration-color:var(--mute)}
@media (max-width:639px){.betab{gap:2px;margin:0 0 0 2px}.betab .beta{font-size:9px}.betab a{font-size:8px}.betab .fw{display:none}}
@media (max-width:389px){.top .brand{font-size:16px;gap:3px}.top .brand .astro{width:19px}.top{column-gap:3px}.betab{margin-left:1px}}

.spacer{flex:1}
.zseg{display:inline-flex;gap:2px}
.zseg button{background:none;border:0;padding:4px 5px;color:var(--mute);font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.02em;opacity:.75}
.zseg button+button{font-size:15px}
.zseg button:hover{color:var(--fg);opacity:1}
.zseg button:disabled{opacity:.25;cursor:default}
.mid,.side,#msearch,.deck>*,.stackx{zoom:var(--z,1)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* tags */
.flag{display:inline-flex;align-items:center;border-radius:3px;padding:1px 7px 1px 6px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;white-space:nowrap}
.flag.sx{color:var(--sex);background:var(--sex-bg);border:1px solid var(--sex-line)}
.flag.lg{color:var(--lg);background:var(--lg-bg);border:1px solid var(--lg-line)}
.flag.aw{color:var(--aw);background:var(--aw-bg);border:1px solid var(--aw-line)}
.flag.io{gap:4px}.flag.io .ico{display:inline-grid;place-items:center;width:11px;min-width:0;height:11px;margin:0;padding:0;background:none;color:inherit}.flag.io svg{width:11px;height:11px}
.flag.io-out{color:#3e9d5c;background:rgba(36,110,60,.16);border:1px solid rgba(46,125,72,.55)}
.flag.io-in{color:#5b9cf0;background:rgba(40,110,220,.12);border:1px solid rgba(70,130,230,.45)}
.flag.io-out.on{background:#2e7d48;color:#04140a}.flag.io-in.on{background:#4a8ef0;color:#04101f}
.flag.od{color:var(--od);background:var(--od-bg);border:1px solid var(--od-line)}
.flag.uc{color:var(--mute);background:transparent;border:1px dashed var(--mute)}
.flag.np,.flag.age{color:var(--fg);background:var(--panel2);border:1px solid var(--line)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}

/* layout */
.browser{margin-top:12px;display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
@media (min-width:880px){.browser{grid-template-columns:240px minmax(0,1fr)}}
@media (min-width:1200px){.browser{grid-template-columns:240px minmax(0,1fr) minmax(340px,400px)}}

/* deck */
.deck{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:16px;align-content:start}
.mid{display:grid;gap:12px;min-width:0;align-content:start}
.rcol{display:grid;gap:12px;align-content:start;min-width:0}
.deck[hidden]{display:none!important}
/* entity colours (Rekordbox palette): event blue, artist purple, collective orange, location green */
:root{--c-ev:#1f8bff;--c-art:#b35cff;--c-col:#ff8c1a;--c-ven:#2fd145}
.deck{--kc:var(--c-ev);border-top:3px solid var(--kc)}
.deck.k-ev{--kc:var(--c-ev);--accent:var(--c-ev);--accent-fg:#fff;--sel:#1d3f6e}
.deck.k-art{--kc:var(--c-art);--accent:var(--c-art);--accent-fg:#fff;--sel:#35204f}
.deck.k-col{--kc:var(--c-col);--accent:var(--c-col);--accent-fg:#1f0f00;--sel:#4a2c0c}
.deck.k-ven{--kc:var(--c-ven);--accent:var(--c-ven);--accent-fg:#06140a;--sel:#173f20}
.deck.empty{border-top-width:1px}
.deck .akind{color:var(--kc)}
body.vw-art{--accent:var(--c-art);--accent-fg:#fff;--sel:#35204f}
body.vw-col{--accent:var(--c-col);--accent-fg:#1f0f00;--sel:#4a2c0c}
body.vw-loc{--accent:var(--c-ven);--accent-fg:#06140a;--sel:#173f20}
/* icons */
.ico{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 3px;border-radius:2px;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1;color:#0b0d10;vertical-align:1px}
.ico.sx{background:var(--sex)}.ico.lg{background:var(--lg)}.ico.aw{background:var(--aw)}.ico.np{background:#e9ecf1}.ico.od{background:var(--od)}
.ico.uc{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
.ico.spk{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
.ico svg{width:11px;height:11px;display:block}
.ii{display:inline-block;width:13px;height:12px;vertical-align:-1px;margin-right:4px}
.ii.col{color:var(--c-col)}.ii.pin{color:var(--c-ven);width:10px;height:12px}
.vchk{color:var(--c-ev);font-weight:800;margin-right:6px;letter-spacing:-.15em}
.tag{display:inline-flex;align-items:center;gap:0;border-radius:3px;padding:1px 7px 1px 6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;white-space:nowrap;line-height:1.5}
.row.tk .tag.ve{max-width:100%;white-space:normal;text-align:left;line-height:1.25}
.tag .ii{margin-right:5px}
.tag.co,.chip.co{color:var(--c-col);border-color:rgba(255,140,26,.55);background:rgba(255,140,26,.10)}
.tag.co .ii,.chip.co .ii{color:var(--c-col)}
.tag.ve,.chip.ve{color:var(--c-ven);border-color:rgba(47,209,69,.5);background:rgba(47,209,69,.08)}
.tag.ge,.chip.ge{color:#cfd5de;border-color:#3a404b;background:var(--panel2)}
.tag.ge::before,.chip.ge::before{content:"♫";margin-right:5px;color:var(--mute)}
.where button[data-venue],.where button[data-vopen]{color:var(--c-ven);border:1px solid rgba(47,209,69,.5);background:rgba(47,209,69,.08);border-radius:3px;padding:1px 8px;text-decoration:none;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.where button[data-venue]:hover,.where button[data-vopen]:hover{color:var(--c-ven);background:rgba(47,209,69,.18)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.row .ve .tags{margin-top:0}
.flag .ico{margin:0 5px 0 -4px;min-width:15px;height:15px;font-size:10px}
.flag .ico.uc{border:0}
.rule{width:100%;text-align:left;font-family:inherit;cursor:pointer}
.rule:hover{filter:brightness(1.2)}
.rule.sx .ic,.rule.lg .ic,.rule.aw .ic,.rule.np .ic,.rule.od .ic{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:2px;color:#0b0d10;font-weight:800}
.rule.sx .ic{background:var(--sex)}.rule.lg .ic{background:var(--lg)}.rule.aw .ic{background:var(--aw)}.rule.np .ic{background:#e9ecf1}.rule.od .ic{background:var(--od)}
/* search clear */
.qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:3px;background:var(--line);color:var(--fg);font-size:15px;line-height:1}
.qx:hover{background:var(--accent);color:var(--accent-fg)}
.search.has{border-color:var(--accent);background:rgba(31,139,255,.10);padding-right:36px}
.search::-webkit-search-cancel-button{display:none}
.favask{margin-top:6px;padding:8px;border:1px solid rgba(255,210,74,.5);border-radius:3px;background:rgba(255,210,74,.08);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.favask[hidden]{display:none}
.favask button{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:3px 9px;font-size:12px}
.favask button.y{background:#ffd24a;color:#111;border-color:#ffd24a}
/* suggest form */
.suggest{display:grid;gap:8px;width:min(100%,520px);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px}
.suggest[hidden]{display:none}
.suggest input,.suggest textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px 9px;font:inherit;color:var(--fg)}
.suggest .sgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.suggest .adm{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.suggest .adm div{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.suggest .adm a{color:var(--fg);overflow-wrap:anywhere;flex:1;min-width:0}
.stackx{position:fixed;right:12px;z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--fg);box-shadow:0 4px 16px rgba(0,0,0,.6)}
.stackx[hidden]{display:none}
.pullhint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--top2,var(--top)) + 10px);transform:translateX(-50%);z-index:12;background:var(--panel2);border:1px solid var(--accent);border-radius:16px;padding:6px 14px 8px;font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.6);pointer-events:none;overflow:hidden}
.pullhint[hidden]{display:none}
.pullhint i{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--accent)}
.footbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.plist{padding:8px 10px;background:var(--panel2);border-radius:3px}
.sndk{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--mute);margin-right:6px}
.snd{font-size:12px;color:var(--mute);margin-top:4px}
.sndline{font-size:13px;color:var(--mute);margin:-2px 0 8px}
.pev{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 10px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
.pev .mono{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.pev small{grid-column:2;color:var(--mute);font-size:12px}
.pev:hover{background:var(--panel2)}
.cal .ev.pastev{opacity:.42;filter:grayscale(.7)}
.cal .ev.pastev:hover,.cal .ev.pastev[aria-current="true"]{opacity:.8}
.cal .dots i.pd{opacity:.35}
.row.pastrow{opacity:.55}
.deck.isp h2{color:var(--mute)}
.morebtn{margin-top:8px;background:none;border:1px solid var(--line);border-radius:3px;color:var(--mute);font-size:12px;padding:5px 12px}
.morebtn:hover{color:var(--fg)}
.badge{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--neg);color:var(--neg);border-radius:2px;padding:1px 6px;margin-left:8px;vertical-align:3px}
.lrow .nx.n0{color:var(--mute)}
@media (min-width:1200px){.rcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top) + 12px);max-height:calc(100vh - var(--top) - 36px - var(--dockh,0px));overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .rcol.stacked{display:block;overflow:visible;max-height:none}
  .rcol.stacked>.deck{position:absolute;left:0;right:0;transform-origin:50% 0;box-shadow:0 -6px 24px rgba(0,0,0,.55)}
  .rcol.stacked>.deck.under{overflow:hidden;cursor:pointer}
  .rcol.stacked>.deck.under>*{pointer-events:none}
  .rcol.stacked>.deck.under::after{content:"";position:absolute;inset:0;background:rgba(6,7,9,.58);pointer-events:none;border-radius:inherit;transition:background .15s}
  .rcol.stacked>.deck.under:hover::after{background:rgba(6,7,9,.4)}
  .rcol.stacked>.deck.front{overflow:auto;overscroll-behavior:contain}
  .rcol.stacked>.deck.under{padding:6px 12px;box-shadow:0 -3px 10px rgba(0,0,0,.5);border-top-width:2px}
  .rcol.stacked>.deck.under .close{pointer-events:auto;position:relative;z-index:2;width:26px;height:26px;font-size:15px}
  .rcol.stacked>.deck.under .favbtn{display:none}
  .rcol.stacked>.deck.under .cbar{display:none}
  .rcol.stacked>.deck.under .ctop .akind{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .rcol.stacked>.deck.under .ctop .akind::after{content:"  ·  " attr(data-t);color:var(--fg);letter-spacing:.02em;text-transform:none;font-size:12px}
  .rcol.stacked>.deck.under::after{border-radius:inherit}
  .rcol.stacked>.deck.under:hover::after{background:rgba(6,7,9,.25)}
  .cardsx{position:absolute;top:0;right:0;z-index:60;height:28px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:0 12px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;color:var(--fg)}
  .cardsx:hover{border-color:var(--fg)}
  .rcol:not(.stacked)>.cardsx{display:none}}
.cardsx[hidden]{display:none}
@media (max-width:1199px){.cardsx{display:none!important}}
@media (max-width:1199px){.rcol{display:contents}
  .deck:not(.empty)::before{content:"";display:block;position:absolute;top:5px;left:50%;transform:translateX(-50%);width:46px;height:12px;margin:0;background-image:radial-gradient(var(--mute) 1.4px,transparent 1.7px);background-size:7.6px 6px;background-position:center;opacity:.9}
  .deck.peek{overflow:hidden;cursor:pointer;touch-action:none}
  .rcol>.deck{overscroll-behavior:contain}
  .deck.peek>*{pointer-events:none}
  .deck.peek .close,.deck.peek .favbtn{pointer-events:auto}
  .deck.peek .meters,.deck.peek .where{opacity:.7}
  .deck.peek .cbar{display:none}
  .deck.peek h2{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck.peek .ctop .akind,.deck.under .ctop .akind{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .deck.peek .ctop .akind::after,.deck.under .ctop .akind::after{content:"  ·  " attr(data-t);color:var(--fg);letter-spacing:.02em;text-transform:none;font-size:12.5px}

.stub .t,.row .stub .t{font-family:"DSEG7",var(--f-mono);font-size:14px;font-weight:400;color:var(--accent);letter-spacing:.02em}
.stub .t small{display:block;color:var(--mute);font-weight:400;font-size:9.5px;margin-top:4px}
.stub .price{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--fg);line-height:1.25;overflow-wrap:anywhere}
.stub .price small{display:block;font-weight:400;color:var(--mute);font-size:10px}
.gcl{display:inline-flex;flex-wrap:wrap;align-items:stretch;border:1px solid #3a404b;border-radius:3px;background:var(--panel2);font-family:var(--f-display);font-weight:600;letter-spacing:.06em;font-size:11.5px;text-transform:uppercase;color:#cfd5de;overflow:hidden;line-height:1.5}
.gcl b{padding:1px 6px;color:var(--mute);font-weight:400}
.gcl span{padding:1px 7px;border-left:1px solid #3a404b}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctop .cbtns{flex:none}
.deck .artists button.hl,.deck .tt button.hl{font-weight:700;color:var(--fg);text-decoration-color:var(--fg)}
.row.tk .arts b.hl{color:var(--fg);font-weight:700}
.deck{grid-template-columns:minmax(0,1fr)}
.ctop .akind{margin:0}
.cbtns{display:flex;gap:6px}
.cbtns .close,.cbtns .favbtn{position:static}
.ehead{display:grid;grid-template-columns:minmax(0,1fr) 104px;margin:0 -16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ehead.hasfly{position:relative;overflow:hidden;isolation:isolate}
.ehead .flybg{position:absolute;inset:-24px;z-index:-2;pointer-events:none}
.ehead .flybg img{width:100%;height:100%;object-fit:cover;filter:blur(14px) saturate(1.3);opacity:.75}
.ehead.hasfly::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(19,21,25,.88),rgba(19,21,25,.62))}
.lgt{position:relative;flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:4px;background:#1b1e24;border:1px solid var(--line);overflow:hidden;font-family:var(--f-pixel);font-weight:900;font-size:15px;line-height:1;color:var(--mute);padding:0}
.lgt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10%;background:inherit;box-sizing:border-box}
.lgt.big{width:60px;height:60px;font-size:20px}
.lgt.ph img{object-fit:cover;padding:0}.lgt img{padding:4%}.lgt[data-flyer]{cursor:zoom-in}.lgt[data-flyer]:hover{border-color:var(--fg)}
.lgt.fly{width:64px;height:64px;cursor:zoom-in;background:#2a2d33}.lgt.fly img{object-fit:cover;padding:0}
.lgt.fly:hover{border-color:var(--fg)}
.ehead .head.wt{display:flow-root}.ehead .head.wt>.lgt{float:left;margin:3px 12px 2px 0}.ehead .head.wt h2{display:inline}.ehead .head.wt .vchk{display:inline-block;margin-left:8px;vertical-align:2px}
.ehead .head.wt .lgt.big{margin-top:0}.ehead .head.wt .lgt.big+h2{display:block;min-height:60px;display:flex;align-items:center}
.xr .c1.wl{flex-direction:row;align-items:center;gap:10px}.xr .c1t{display:flex;flex-direction:column;gap:4px;min-width:0}
.ehead .flybtn{position:relative;z-index:2;font-family:var(--f-mono);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:4px 8px;cursor:zoom-in}
.ehead .flybtn:hover{border-color:var(--fg)}
.flybox{position:fixed;inset:0;z-index:220;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.flybox[hidden]{display:none}
.cov[data-flyer]{cursor:zoom-in}
.flybox img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.flybox .fx{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;font-size:20px}
.flybox a{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#cfd5de;font-size:12px}
.emain{display:flex;flex-direction:column;gap:7px;padding:12px 14px 14px 16px;min-width:0}
.ehead .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.deck .ehead h2{margin:0;padding:0;font-size:clamp(20px,6.2vw,26px);overflow-wrap:break-word;hyphens:auto;min-width:0}
.ehead .vchk{font-size:20px;flex:none;margin:0}
.ehead .tags,.ehead .flags{margin:0}
.ehead button.tag,.ehead button.flag{cursor:pointer}
.ehead button.tag:hover,.ehead button.flag:hover{filter:brightness(1.25)}
.addr{color:var(--mute);font-size:13px;text-underline-offset:3px;text-decoration-color:var(--line)}
.gcl button{all:unset;cursor:pointer;padding:1px 7px;border-left:1px solid #3a404b}
.gcl button:hover{background:var(--line)}
.gcl button.typ{color:var(--mute)}
.ehead .stub{padding:12px 6px}
.stub .dt{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent)}
.artists button,.tt button{text-decoration:underline;text-decoration-color:#5a616d;text-underline-offset:3px;text-decoration-thickness:1px}
.cbar{position:sticky;bottom:-18px;margin:0 -16px -18px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;background:#101216;border-top:1px solid var(--line);z-index:2}
.ibtn{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);display:grid;place-items:center;color:var(--fg);padding:0}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{border-color:var(--mute)}
.tixbtn{height:40px;padding:0 16px;white-space:nowrap;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;text-decoration:none}
.tixbtn.off{background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.sstats{gap:10px;justify-content:flex-start;padding-top:14px}
.sstats .st small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.sstats .st b{font-family:var(--f-mono);font-size:15px;color:var(--accent)}.sstats .st b.w{color:var(--fg)}
.sub2{color:var(--mute);font-size:13px}.sub2 .ii{color:var(--mute)}
.deck .sh{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.deck .sh i{font-style:normal;color:var(--accent)}
.mev{display:grid;grid-template-columns:minmax(0,1fr) 66px;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:3px;margin-bottom:4px;padding:0;color:var(--fg);overflow:hidden}
.mev .m{padding:7px 9px;font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}.mev .m small{display:block;color:var(--mute);font-weight:400;font-size:11.5px;margin-top:2px}
.mev .s{border-left:1px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c-ev);text-align:center;line-height:1.35}
.mev.past .m{color:#b7bdc7}.mev.past .s{color:var(--mute)}
.mev:hover{background:var(--sel)}

.calnav button:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{background:var(--panel2);padding:6px;font-family:var(--f-mono);font-size:10px;color:var(--mute);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cell{min-height:70px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);text-align:left;font:inherit;color:inherit;border-top:0;border-left:0}
.cell:nth-child(7n){border-right:0}
.cell.other{background:var(--panel3)}
.cell.other .n{opacity:.55}
.cell.past{opacity:.45}
.cell .n{font-family:var(--f-mono);font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:baseline}
.cell.today .n{color:var(--cueA);font-weight:600}
.ev{display:flex;gap:5px;align-items:stretch;background:var(--panel2);border:0;border-radius:1px;padding:0;font-size:11px;text-align:left;line-height:1.25;width:100%}
.ev .st{display:flex;gap:2px;flex:none}
.ev .st i{width:3px;border-radius:1px}
.ev .tx{padding:2px 4px 2px 0;overflow-wrap:anywhere;min-width:0}
.ev:hover,.ev[aria-current="true"]{background:var(--sel)}
.dots{display:none}
.daylist{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:3px;height:12px;border-radius:1px}
@media (max-width:639px){
  .cal .ev{display:none}
  .cell{min-height:52px;align-items:center;cursor:pointer;padding:5px 2px}
  .cell .n{font-size:13px;color:var(--fg)}
  .cell.sel{background:var(--sel)}
  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
  .dots i{width:5px;height:5px;border-radius:50%}
  .daylist{display:block;border-top:1px solid var(--line)}
}

footer{display:grid;gap:8px;justify-items:center;text-align:center;padding:8px 8px 24px;color:var(--mute);font-size:12px;line-height:1.55}
footer p{margin:0;max-width:80ch}
footer a{color:var(--mute);text-underline-offset:2px;text-decoration-color:var(--line)}
footer a:hover{color:var(--accent)}
.report{background:none;border:1px solid var(--line);border-radius:3px;color:var(--mute);font-size:12px;padding:5px 12px;text-decoration:none;display:inline-block}
.report:hover{color:var(--fg);border-color:var(--mute)}

@media (prefers-reduced-motion:no-preference){.row,.opt,.sg{transition:background .12s}}

function icsText(e){const [s,en]=evTimes(e);const x=t=>String(t).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");

/* suggestions */
function suggestions(q){
  const f=fold(q.trim());if(f.length<2)return [];
  const l=L();const out=[];
  const add=(k,name,count,extra,date)=>{const i=fold(name).indexOf(f);if(i<0)return;out.push({k,name,count,i,extra,date})};
  const cnt=(get,base=[])=>{const m=new Map(base.map(x=>[x,0]));EV.forEach(e=>get(e).forEach(x=>m.set(x,(m.get(x)||0)+1)));return m};
  cnt(e=>e.coll,UNI.c).forEach((c,n)=>add("c",n,c));
  cnt(e=>e.artists,ALLART()).forEach((c,n)=>add("a",n,c));
  cnt(e=>[e.venue],UNI.v).forEach((c,n)=>add("v",n,c));
  cnt(e=>e.genres,Object.values(CGEN).flat()).forEach((c,n)=>add("g",n,c));
  FLAGS.forEach(([k,,lab])=>add("f",l[lab],EV.filter(e=>e[k]).length,k));
  EV.forEach(e=>add("e",e.title,null,e.id,e.d));
  PASTR.forEach(p=>add("e",p.t,null,p.id,p.d));
  const order={c:0,a:1,v:2,g:3,f:4,e:5};
  return out.sort((a,b)=>(a.i===0?0:1)-(b.i===0?0:1)||order[a.k]-order[b.k]||(a.k==="e"?(b.date||"").localeCompare(a.date||""):a.name.localeCompare(b.name))).slice(0,14);
}

async function getDB(){if(DB)return DB;try{DB=window.claude?await window.claude.use("db"):null}catch(_){DB=null}return DB}
$("sugform").addEventListener("submit",async ev=>{ev.preventDefault();const l=L();const url=$("sugurl").value.trim(),note=$("sugnote").value.trim();if(!/^https?:\/\//.test(url))return;
  const msg=$("sugmsg");msg.textContent="…";const db=await getDB();
  const mail="mailto:feedback@rave.wien?subject="+encodeURIComponent(l.sug)+"&body="+encodeURIComponent(url+(note?"\n\n"+note:""));
  if(db){try{await db.collection("suggestions").add({url,note,ts:Date.now(),status:"new",lang:st.lang});msg.textContent=l.sugOk;$("sugurl").value="";$("sugnote").value="";return}catch(_){}}
  location.href=mail;msg.innerHTML=`${esc(l.sugMailOpen)} <a href="${esc(su(mail))}">${esc(l.sugMailAgain)}</a>`});
async function initAdmin(){if(ADMIN)return;ADMIN=true;const db=await getDB();if(!db)return;
  try{USER=window.claude?await window.claude.use("user"):null;if(!USER||!(await USER.isOwner()))return}catch(_){return}
  let SUGS=[],APPR={};
  const draw=()=>{const l=L();const box=$("sugadm");box.hidden=false;const open=SUGS.filter(s=>s.status==="pending"||s.status==="new");
    box.innerHTML=`<b class="lbl">${l.sugAdm}</b>`+(open.length?open.map(s=>{const a=APPR[s.id];const stt=a?a.status:s.status;return `<div><a href="${esc(su(s.url))}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a><small style="color:var(--mute)">${esc(l.sugSt[stt]||stt)}${s.reason?" · "+esc(s.reason):""}</small>${a?"":`<button class="report" data-appr="${esc(s.id)}" data-st="approved">${l.approve}</button><button class="report" data-appr="${esc(s.id)}" data-st="rejected">${l.reject}</button>`}</div>`}).join(""):`<small style="color:var(--mute)">${l.sugNone}</small>`)};
  try{db.collection("suggestions").onSnapshot(q=>{SUGS=q.docs.map(d=>Object.assign({id:d.id},d.data()));draw()},()=>{});db.collection("approvals").onSnapshot(q=>{APPR={};q.docs.forEach(d=>APPR[d.id]=d.data());draw()},()=>{})}catch(_){}}
async function approve(id,status){const db=await getDB();if(!db)return;try{await db.collection("approvals").doc(id).set({status,ts:Date.now()})}catch(_){}}
const FKEY="rw-filters",FK=["g","v","c","a","f","src","age","price","time","io"];
function hasSaved(){try{return !!localStorage.getItem(FKEY)}catch(_){return false}}
function loadSaved(){try{const o=JSON.parse(localStorage.getItem(FKEY)||"null");if(!o)return;FK.forEach(k=>{if(Array.isArray(o[k]))st[k]=new Set(o[k]);if(o.x&&Array.isArray(o.x[k]))st.x[k]=new Set(o.x[k])});}catch(_){}}
applyZ();placeSearch();loadSaved();fromHash();render();setTop();
addEventListener("hashchange",()=>{if(Date.now()-HPOP<400)return;const id=location.hash.slice(1);if(id&&id!==st.sel){fromHash();render()}});

if(EMBED&&!CONS)showBanner();

const docId=(k,key)=>(k+"-"+slug(key)).slice(0,190)||k+"-x";

const get=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const allGenres=()=>[...new Set([...EV.flatMap(e=>e.genres),...Object.values(CGEN).flat(),...Object.values(AR).flatMap(a=>a.genres||[])])].sort((a,b)=>a.localeCompare(b));

function schema(kind){

  return [

    ["de","Beschreibung (DE)","textarea","full"],["en","Beschreibung (EN)","textarea","full"],
    ["io","Indoor / Outdoor","checks","full",{opts:["Indoor","Outdoor"]}],["ioMain","Bei beidem: hauptsächlich","select",null,{opts:["","Outdoor"],labels:["Indoor (Nov–Feb automatisch drinnen)","Outdoor (z. B. Usus)"]}],
    ["floors","Floors","chips","full"],["logo","Logo (Bild-Adresse)","url"],

    ["_rules","Hausregeln","rflags","full",{flags:RULEFLAGS}]];
}
function current(kind,key){
  if(kind==="ev"){const e=EV.find(x=>x.id===key)||{};const o={title:e.title||"",d:e.d||"",venue:e.venue||"",s:e.s||"",e:e.e||"",coll:e.coll||[],genres:e.genres||[],
      floors:e.floors||[],head:e.head||[],price:e.price||"",age:e.age&&e.age!==e.clubAge?e.age:"",tickets:e.tickets||"",flyer:e.flyer||"",note:e.note||{},io:e.io||[]};
    EVFLAGS.forEach(([f])=>o[f]=!!e[f]&&!(e.fromVenue||[]).includes(f)&&!(e.fromColl||{})[f]);return o}
  if(kind==="art"){const a=ARK[akey(key)]||{};return JSON.parse(JSON.stringify(a))}

  const v=JSON.parse(JSON.stringify(VINFO[key]||{}));v.address=V[key]&&V[key]!=="Wien"?V[key]:"";const r=VRULES[key]||{};v.rules={age:r.age||""};RULEFLAGS.forEach(([f])=>v.rules[f]=!!r[f]);return v}
function setTitleFromUrl(u){try{const p=new URL(u).pathname.split("/").filter(Boolean);const seg=p.length>1?p[p.length-1]:"";
  if(!seg||/^(sets|s-|[A-Za-z0-9]{10,}$)/.test(seg)&&!/-/.test(seg))return "";return decodeURIComponent(seg).replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/\b\w/g,c=>c.toUpperCase())}catch(_){return ""}}
const floorsTxt=fl=>(fl||[]).map(f=>(f.f?f.f+": ":"")+f.a.join(", ")).join("\n");
const parseFloors=t=>t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=/^([^:|]{1,40}):\s*(.*)$/.exec(l);const f=m&&!/^\d{1,2}$/.test(m[1].trim())?m[1].trim():"";const rest=m&&f?m[2]:l;

function chipsHTML(id,vals,list){return `<div class="chips" data-chips="${id}">${vals.map(v=>`<span data-v="${esc(v)}">${esc(v)}<button type="button" aria-label="entfernen" data-rm>×</button></span>`).join("")}<input type="text" ${list?`list="${list}"`:""} placeholder="hinzufügen + Enter"></div>`}
function field([p,lab,type,cls,opt],cur){opt=opt||{};const v=p.startsWith("_")?null:get(cur,p);const id="edf-"+p.replace(/\./g,"_");let inp="";
  if(type==="chips")inp=chipsHTML(p,Array.isArray(v)?v:[],opt.list);

  else if(type==="sets")inp=`<textarea class="mono" data-p="sets">${esc((v||[]).map(x=>(x.t&&!x.auto?x.t+" | ":"")+(x.u||"")).join("\n"))}</textarea><div class="hint">Eine Zeile pro Set – einfach den Link einfügen. Den richtigen Namen holt sich der Lauf beim Live-Schalten selbst. Eigener Name optional als „Name | Link“. Das erste Set ist das Haupt-Set.</div>`;

  else if(type==="flags")inp=`<div class="edflags">${opt.flags.map(([f,l])=>`<label><input type="checkbox" data-p="${f}"${cur[f]?" checked":""}> ${esc(l)}</label>`).join("")}</div>`;

  else if(type==="checks")inp=`<div class="edflags">${opt.opts.map(o=>`<label><input type="checkbox" data-pc="${p}" value="${esc(o)}"${(v||[]).includes(o)?" checked":""}> ${esc(o)}</label>`).join("")}</div>`;

function openEdit(kind,key,isNew){
  const p=isNew?null:pend(kind,key);let cur=isNew?{}:current(kind,key);
  if(p&&p.data){cur=JSON.parse(JSON.stringify(cur));Object.entries(p.data).forEach(([k,v])=>{const parts=k.split(".");let o=cur;parts.slice(0,-1).forEach(x=>{o[x]=o[x]&&typeof o[x]==="object"?o[x]:{};o=o[x]});o[parts[parts.length-1]]=v})}
  const box=$("edbox");const title=isNew?"Neues "+KN[kind]:(kind==="ev"?(EV.find(x=>x.id===key)||{}).title||key:key);

   ${isNew&&kind!=="ev"?`<div class="edf full" style="margin-bottom:10px"><label>Name</label><input type="text" data-newkey value=""></div>`:""}
   <div class="edgrid">${schema(kind).map(f=>field(f,cur)).join("")}</div>
   <datalist id="edl-gen">${allGenres().map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
   <datalist id="edl-col">${[...new Set([...UNI.c,...Object.keys(CINFO)])].sort().map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
   <datalist id="edl-art">${ALLART().sort((a,b)=>fold(a).localeCompare(fold(b))).map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
   <datalist id="edl-ven">${UNI.v.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
   <div class="edact"><div>${!isNew?`<button type="button" class="del" data-eddel>${kind==="ev"?"Event löschen":"Eintrag löschen"}</button>`:""}${p?` <button type="button" data-edundo>Änderung verwerfen</button>`:""}</div>

function collect(box){const kind=box.dataset.kind;const out={};
  box.querySelectorAll("[data-p]").forEach(el=>{const p=el.dataset.p;if(p==="floors"){out.floors=parseFloors(el.value);return}
    if(p==="sets"){out.sets=el.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=/^(.*?)\s*\|\s*(https?:\/\/\S+)$/.exec(l);
      if(m&&m[1])return {t:m[1].trim(),u:m[2]};const u=(m?m[2]:(l.match(/https?:\/\/\S+/)||[""])[0]);return u?{t:setTitleFromUrl(u),u,auto:1}:null}).filter(Boolean);return}
    out[p]=el.type==="checkbox"?el.checked:el.value.trim()});
  box.querySelectorAll("[data-chips]").forEach(c=>{const inp=c.querySelector("input");if(inp.value.trim())addChip(c,inp.value.trim());out[c.dataset.chips]=[...c.querySelectorAll("span[data-v]")].map(s=>s.dataset.v)});
  const pcs={};box.querySelectorAll("[data-pc]").forEach(el=>{(pcs[el.dataset.pc]=pcs[el.dataset.pc]||[]);if(el.checked)pcs[el.dataset.pc].push(el.value)});Object.assign(out,pcs);

function diff(cur,now){const d={};Object.entries(now).forEach(([k,v])=>{const o=get(cur,k);const norm=x=>x==null||x===false||x===""||(Array.isArray(x)&&!x.length)?null:x;

async function save(){const box=$("edbox");const kind=box.dataset.kind;const isNew=!!box.dataset.isnew;let key=box.dataset.key;
  const now=collect(box);
  if(isNew){if(kind==="ev"){if(!now.title||!now.d){await ask("Titel und Datum sind Pflicht.",true);return}key=(now.d+"-"+slug(now.title)).slice(0,60).replace(/-$/,"")}
    else{key=(box.querySelector("[data-newkey]")||{}).value?.trim();if(!key){await ask("Bitte einen Namen eingeben.",true);return}}}
  const data=isNew?Object.fromEntries(Object.entries(now).filter(([,v])=>v!==""&&v!==false&&!(Array.isArray(v)&&!v.length))):diff(box._orig,now);
  if(isNew&&kind==="ev"&&!data.floors)data.floors=[{f:"",a:["TBA"]}];
  const prev=pend(kind,key);const merged=Object.assign({},prev&&prev.op!=="delete"?prev.data:{},data);
  const bu=badUrl(merged);if(bu){await ask("Link muss mit https:// beginnen: "+bu[0],true);return}
  if(!Object.keys(merged).length){closeEd();return}
  const title=kind==="ev"?(now.title||(EV.find(x=>x.id===key)||{}).title||key):key;
  await write(kind,key,{op:isNew?"add":(prev&&prev.op==="add"?"add":"edit"),data:merged,title});closeEd()}
async function write(kind,key,o){if(!EDB)return;try{await EDB.collection("edits").doc(docId(kind,key)).set(Object.assign({kind,key,ts:Date.now(),status:"pending"},o));toast("Gespeichert – noch nicht live.")}catch(e){await ask("Speichern fehlgeschlagen: "+(e&&e.code||e),true)}}
function closeEd(){$("edmod").hidden=true;$("edbox").innerHTML=""}
let tmsg="";function toast(t){tmsg=t;drawBar();setTimeout(()=>{if(tmsg===t){tmsg="";drawBar()}},6000)}

function drawBar(){const bar=$("edbar");if(!ON){bar.hidden=true;return}const list=Object.values(EDITS).filter(d=>d.status==="pending");
  const err=Object.values(EDITS).filter(d=>d.status==="error");
  bar.hidden=false;bar.innerHTML=`<span>✎ <b>${list.length}</b> ausstehend${err.length?` · <span style="color:#ff6b6b">${err.length} Fehler</span>`:""}</span>
   <button type="button" data-edlist>Ansehen</button><button type="button" data-ednew="ev">＋ Event</button>
   ${list.length?`<button type="button" class="go" data-edlive>Live schalten</button>`:""}${tmsg?`<span class="msg">${esc(tmsg)}</span>`:""}`;
  document.querySelectorAll(".deck[data-card]").forEach(decorate)}
function showList(){const box=$("edbox");const all=Object.entries(EDITS).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).slice(0,60);
  const st2={pending:"ausstehend",applied:"live",error:"Fehler"};
  box.innerHTML=`<h2>Änderungen</h2><div class="sub">Ausstehende gehen mit „Live schalten“ online. Danach erscheinen sie hier als „live“.</div>
  <ul class="edlist">${all.length?all.map(([id,d])=>`<li><span>${esc(KN[d.kind]||d.kind)} · <b>${esc(d.title||d.key)}</b> <small>${d.op==="delete"?"löschen":d.op==="add"?"neu":Object.keys(d.data||{}).join(", ")}</small><br><small>${esc(st2[d.status]||d.status)}${d.err?" – "+esc(d.err):""} · ${new Date(d.ts).toLocaleString("de-AT")}</small></span>${d.status!=="applied"?`<button type="button" data-eddrop="${esc(id)}">verwerfen</button>`:""}</li>`).join(""):"<li>Noch keine Änderungen.</li>"}</ul>
  <div class="edact"><span></span><div class="r"><button type="button" data-edcancel>Schließen</button></div></div>`;$("edmod").hidden=false}
async function goLive(){const n=Object.values(EDITS).filter(d=>d.status==="pending").length;if(!n)return;
  if(!await ask(n+" Änderung(en) jetzt live schalten?"))return;
  try{const mcp=await claude.use("mcp");if(!mcp)throw {code:"unavailable"};await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:TRIGGER,text:"Ausgelöst über den Bearbeitungsmodus ("+n+" Änderungen)."});
    toast("Läuft – in ein paar Minuten auf rave.wien. Du bekommst eine Push-Nachricht.")}catch(e){toast("Konnte den Lauf nicht starten ("+(e&&e.code||"Fehler")+"). Bitte Claude Bescheid geben.")}}
function decorate(el){if(!ON)return;const key=el.dataset.card;if(!key)return;const [k,n]=key.split("\u0001");if(!KN[k])return;
  const cb=el.querySelector(".ctop .cbtns");if(!cb)return;let b=cb.querySelector(".edbtn");
  if(!b){b=document.createElement("button");b.type="button";b.className="edbtn";b.title="Bearbeiten";b.setAttribute("aria-label","Bearbeiten");b.textContent="✎";b.dataset.edit=key;cb.prepend(b)}
  b.classList.toggle("pend",!!pend(k,n))}

document.addEventListener("click",async ev=>{if(!ON)return;const t=ev.target;
  if(t.closest("#edask")){ev.stopPropagation();ev.preventDefault();if(ASKRES){if(t.id==="edasky")ASKRES(true);else if(t.id==="edaskn"||t.id==="edask")ASKRES(false)}return}
  const ed=t.closest("[data-edit]");if(ed){ev.preventDefault();ev.stopPropagation();const [k,n]=ed.dataset.edit.split("\u0001");openEdit(k,n,false);return}
  if(t.closest("[data-ednew]")){openEdit(t.closest("[data-ednew]").dataset.ednew,"",true);return}
  if(t.closest("[data-edlist]")){showList();return}
  if(t.closest("[data-edlive]")){goLive();return}
  if(!t.closest("#edmod"))return;ev.stopPropagation();
  if(t.id==="edmod"||t.closest("[data-edcancel]")){closeEd();return}
  if(t.closest("[data-rm]")){t.closest("span[data-v]").remove();return}
  if(t.closest("[data-edsave]")){save();return}
  if(t.closest("[data-eddrop]")){const id=t.closest("[data-eddrop]").dataset.eddrop;if(await ask("Diese Änderung verwerfen?")){try{await EDB.collection("edits").doc(id).delete()}catch(_){}}return}
  if(t.closest("[data-edundo]")){const b=$("edbox");if(await ask("Ausstehende Änderung verwerfen?")){try{await EDB.collection("edits").doc(docId(b.dataset.kind,b.dataset.key)).delete()}catch(_){}closeEd()}return}
  if(t.closest("[data-eddel]")){const b=$("edbox");const k=b.dataset.kind,key=b.dataset.key;const ttl=k==="ev"?(EV.find(x=>x.id===key)||{}).title:key;
    if(await ask(`„${ttl}“ wirklich löschen? Das geht mit „Live schalten“ online.`)){await write(k,key,{op:"delete",data:{},title:ttl});closeEd()}return}
},true);
document.addEventListener("keydown",ev=>{if(!ON||$("edmod").hidden)return;
  if(ev.key==="Escape"){ev.stopPropagation();closeEd();return}
  const c=ev.target.closest&&ev.target.closest("[data-chips]");if(c&&(ev.key==="Enter"||ev.key===",")){ev.preventDefault();const v=ev.target.value.trim().replace(/,$/,"");if(v)addChip(c,v);ev.target.value=""}
  if(c&&ev.key==="Backspace"&&!ev.target.value){const s=c.querySelectorAll("span[data-v]");if(s.length)s[s.length-1].remove()}},true);

const _rd=renderDeck;renderDeck=function(){_rd();if(ON)document.querySelectorAll(".deck[data-card]").forEach(decorate)};
(async()=>{if(EMBED||!window.claude)return;try{const u=await claude.use("user");if(!u||!(await u.isOwner()))return;EDB=await claude.use("db");if(!EDB)return;ON=true;
  EDB.collection("edits").onSnapshot(q=>{EDITS={};q.docs.forEach(d=>EDITS[d.id]=d.data());drawBar()},()=>{});drawBar()}catch(_){}})();
})();
</script>

</html>
