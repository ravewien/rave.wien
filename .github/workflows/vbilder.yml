name: Veranstalter-Bilder suchen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suchen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/vbilder.js
      - uses: actions/upload-artifact@v4
        with:
          name: vbilder
          path: vbilder.json
