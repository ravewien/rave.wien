name: Veranstalter-Bilder suchen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  suchen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/vbilder.js
      - name: Ergebnis auf Nebenzweig ablegen (nicht main)
        run: |
          mkdir /tmp/o && cp vbilder.json /tmp/o/ && cd /tmp/o && git init -q -b vbilder && git config user.name "rave.wien Werkzeug" && git config user.email "ravewien@users.noreply.github.com"
          git add vbilder.json && git commit -qm "Kandidaten Veranstalter-Bilder"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:vbilder
