name: Vorschauseiten
# Erzeugt nach jedem Daten-Update die Vorschauseiten für geteilte Links
# (/e/…, /a/…, /c/…, /v/…) und legt sie im Repo ab.
on:
  push:
    branches: [main]
    paths: [events.js, past.js, .github/scripts/previews.js, .github/scripts/stats.js, .github/scripts/logos.js, .github/scripts/geocode.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: previews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Werkzeuge
        run: npm i --no-save --no-package-lock --silent sharp@0.33.5
      - name: Erzeugen und speichern
        run: |
          git config user.name "rave.wien Vorschau"
          git config user.email "ravewien@users.noreply.github.com"
          # Bei jedem Versuch auf den neuesten Stand setzen und alles neu erzeugen –
          # so gibt es keine Konflikte, wenn kurz hintereinander mehrere Updates kommen.
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            node .github/scripts/previews.js
            node .github/scripts/logos.js
            node .github/scripts/geocode.js || true
            node .github/scripts/stats.js
            node .github/scripts/ics.js
            git add e a c v cal stats.json logos.js logos-kaputt.txt geo.js
            if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
            git commit -q -m "Vorschauseiten und Statistik aktualisiert"
            git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
