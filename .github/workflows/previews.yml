name: Vorschauseiten
# Erzeugt nach jedem Daten-Update die Vorschauseiten für geteilte Links
# (/e/…, /a/…, /c/…, /v/…) und legt sie im Repo ab.
on:
  push:
    branches: [main]
    paths: [events.js, past.js, .github/scripts/previews.js, .github/scripts/stats.js, .github/scripts/logos.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: previews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seiten erzeugen
        run: node .github/scripts/previews.js
      - name: Logos vermessen
        run: |
          npm i --no-save --no-package-lock --silent sharp@0.33.5
          node .github/scripts/logos.js
      - name: Statistik erzeugen
        run: node .github/scripts/stats.js
      - name: Speichern
        run: |
          git config user.name "rave.wien Vorschau"
          git config user.email "ravewien@users.noreply.github.com"
          git add e a c v stats.json logos.js
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Vorschauseiten und Statistik aktualisiert"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
