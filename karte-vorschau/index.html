<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Karten-Vorschau · rave.wien</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../fonts.css">
<style>
:root{--bg:#08090b;--fg:#e9ecf1;--mute:#8f96a3;--line:#2a2e36;--panel:#131519;--ven:#2fd145;--ev:#1f8bff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Barlow,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(8,9,11,.92);border-bottom:1px solid var(--line)}
header b{font-family:Doto,monospace;font-weight:900;font-size:20px}header b i{color:var(--ev);font-style:normal}
header span{font:600 12px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:auto}
#map{position:absolute;top:52px;left:0;right:0;bottom:0;background:#0d0f12}
.pin{display:grid;place-items:center;border-radius:50%;background:rgba(47,209,69,.18);border:2px solid var(--ven);color:#fff;font:700 12px "Barlow Condensed";box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.pin.none{background:rgba(143,150,163,.15);border-color:#5a616d;color:var(--mute)}
.lbl{background:none;border:0;box-shadow:none;color:#dfe6ee;font:600 12px Barlow;text-shadow:0 0 3px #000,0 0 3px #000;padding:0}
.lbl:before{display:none}
#map:not(.zl) .lbl{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.35;min-width:200px}
.pp h3{margin:0 0 2px;font:900 17px Doto,monospace;color:var(--fg)}.pp .ad{color:var(--mute);font-size:12.5px;margin-bottom:8px}
.pp .nx{border-top:1px solid var(--line);padding-top:7px}.pp .nx small{display:block;font:600 11px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pp .nx b{color:var(--ev);font-weight:600}.pp a{display:inline-block;margin-top:9px;color:var(--ven);font-weight:600;text-decoration:none}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.leaflet-control-attribution{background:rgba(8,9,11,.7)!important;color:var(--mute)!important}.leaflet-control-attribution a{color:#aab!important}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-color:var(--line)}
.legend{position:absolute;z-index:999;left:10px;bottom:24px;background:rgba(19,21,25,.92);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ven);background:rgba(47,209,69,.18);vertical-align:-2px;margin-right:5px}
.legend i.n{border-color:#5a616d;background:rgba(143,150,163,.15)}
</style></head><body>
<header><b>rave<i>.</i>wien</b><span>Locations · Karte (Vorschau)</span></header>
<div id="map"></div>
<div class="legend"><i></i>kommende Events (Zahl)<br><i class="n"></i>derzeit keine</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../events.js"></script><script src="../geo.js"></script>
<script>
const G=Object.assign({},typeof VG!=="undefined"?VG:{},typeof GEO2!=="undefined"?GEO2:{});
const today=new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Vienna"});
const slug=t=>String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("de-AT",{weekday:"short",day:"2-digit",month:"2-digit"});
const VIx=typeof VI!=="undefined"?VI:{};
const pins={};Object.keys(V).forEach(v=>{if(v==="TBA"||v==="Secret Location")return;const g=G[v];if(!g||(VIx[v]||{}).closed)return;const k=g.join(",");(pins[k]=pins[k]||{g,names:[],ev:[]}).names.push(v)});
RAW.filter(e=>e.d>=today).forEach(e=>{const g=G[e.venue];if(g&&pins[g.join(",")])pins[g.join(",")].ev.push(e)});
const map=L.map("map",{zoomControl:true}).setView([48.2085,16.3721],12);
const CARTO_KEY="cb1_50ze_1_30d6a4e8f278661651e4019d"; // öffentlicher Karten-Schlüssel (CARTO Basemaps), vom Betreiber freigegeben
L.tileLayer("https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key="+CARTO_KEY,{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
const all=[];
Object.values(pins).forEach(p=>{p.ev.sort((a,b)=>(a.d+(a.s||"")).localeCompare(b.d+(b.s||"")));const n=p.ev.length,sz=n?Math.min(34,20+n*1.5):14;
  const name=p.names.length>1&&/^FLUCC/.test(p.names[0])?"FLUCC":p.names.join(" / ");
  const m=L.marker(p.g,{icon:L.divIcon({className:"",html:`<div class="pin${n?"":" none"}" style="width:${sz}px;height:${sz}px">${n||""}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}).addTo(map);
  m.bindTooltip(esc(name),{permanent:true,direction:"right",offset:[sz/2,0],className:"lbl"});
  const nx=p.ev.slice(0,3).map(e=>`<div>${fmt(e.d)} · <b>${esc(e.s||"")}</b> ${esc(e.title)}</div>`).join("");
  m.bindPopup(`<div class="pp"><h3>${esc(name)}</h3><div class="ad">${esc(V[p.names[0]]||"")}</div>${n?`<div class="nx"><small>${n} kommende Events</small>${nx}${n>3?`<div style="color:var(--mute)">+ ${n-3} weitere</div>`:""}</div>`:`<div class="nx"><small>Derzeit keine Events</small></div>`}<a href="https://rave.wien/#v/${slug(p.names[0])}">Location öffnen →</a></div>`);
  all.push(p.g)});
map.setView([48.2075,16.365],13);const zl=()=>map.getContainer().classList.toggle("zl",map.getZoom()>=14);map.on("zoomend",zl);zl();
</script></body></html>
